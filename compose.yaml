services:

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    env_file:
      - .env

    volumes:
      - sqlite_data:/data

    restart: unless-stopped


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    depends_on:
      - backend

    ports:
      - "80:80"

    restart: unless-stopped


volumes:
  sqlite_data: